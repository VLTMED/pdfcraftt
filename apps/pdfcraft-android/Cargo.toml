[package]
name = "pdfcraft-android-native"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
jni = "0.21.1"
pdfcraft-automation = { workspace = true, default-features = false }
pdfcraft-engine = { workspace = true }
serde_json = { workspace = true }

# Keep unsafe code denied in this crate; only the exported JNI symbols have local exceptions.
[lints.rust]
unsafe_code = "deny"
